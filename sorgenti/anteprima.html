<!DOCTYPE html>
<!-- Modello dell'immagine di anteprima per i social (assets/img/anteprima.png).
     Per rigenerarla: apri questo file in un browser a 1200×630 e salva uno screenshot. -->
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../assets/fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-latin-wght-italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    padding: 64px 80px; background: #f1effa; color: #1d1633;
    font-family: "Bricolage Grotesque", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .marchio { font-weight: 800; font-size: 44px; letter-spacing: -0.03em; }
  .marchio span { background: #ffe45c; padding: 0 0.22em 0.04em; margin-left: 0.04em; border-radius: 0.2em 0.5em 0.25em 0.45em; }
  h1 { margin: 0; font-weight: 800; font-size: 92px; line-height: 0.98; letter-spacing: -0.045em; max-width: 16ch; }
  .obiezione { margin: 0; font-family: "Newsreader", serif; font-style: italic; font-size: 34px; color: #c2185b; }
  .riga { display: flex; justify-content: space-between; align-items: end; border-top: 4px solid #1d1633; padding-top: 22px; }
  .riga b { font-size: 26px; font-weight: 600; color: #5236e0; }
</style>
</head>
<body>
  <div class="marchio">Contro<span>tesi</span></div>
  <h1>Ogni tesi vale quanto la migliore obiezione a cui sa rispondere.</h1>
  <div class="riga">
    <p class="obiezione">Idee d'investimento messe alla prova</p>
    <b>Tesi · obiezioni · risposte</b>
  </div>
</body>
</html>
